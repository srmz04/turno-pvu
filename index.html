<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURNO-PVU | Sistema de Gestión de Vacunación</title>
    <link rel="stylesheet" href="./shared/styles-base.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            margin: 0;
            padding: 20px;
        }

        .landing-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .menu-grid {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }

        .menu-item {
            display: block;
            padding: 15px;
            background: var(--bg-light);
            border-radius: var(--border-radius);
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid #eee;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            background: #e8f5e9;
            border-color: var(--success-color);
        }

        .menu-item i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="landing-card">
        <div class="logo">
            <i class="fas fa-syringe"></i>
        </div>
        <h1>Sistema TURNO-PVU</h1>
        <p class="text-medium">Plataforma Universal de Vacunación</p>

        <div class="menu-grid">
            <a href="/publico" class="menu-item">
                <i class="fas fa-users"></i> Panel Público (Ciudadanos)
            </a>
            <a href="/registro" class="menu-item">
                <i class="fas fa-notes-medical"></i> Módulo de Registro
            </a>
            <a href="/aplicar" class="menu-item">
                <i class="fas fa-user-nurse"></i> Módulo de Aplicación
            </a>
            <a href="/coordinador" class="menu-item">
                <i class="fas fa-user-tie"></i> Coordinación de Centro
            </a>
            <a href="/admin" class="menu-item" style="border-top: 1px dashed #ccc; margin-top: 10px;">
                <i class="fas fa-cogs"></i> Administración del Sistema
            </a>
        </div>

        <div class="footer">
            v1.0.1 (Stable) &bull; Cloudflare Pages
        </div>
    </div>

</body>

</html>
