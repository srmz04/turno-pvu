# Staging environment
name = "turno-pvu-backend-staging"
main = "worker.js"
compatibility_date = "2024-01-29"

[vars]
ENVIRONMENT = "staging"

[[d1_databases]]
binding = "TURNO_PVU_DB"
database_name = "turno-pvu-db-staging"
database_id = ""

[[kv_namespaces]]
binding = "TURNO_PVU_CACHE"
id = ""

[observability]
enabled = true
