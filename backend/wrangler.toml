name = "turno-pvu-backend"
main = "worker.js"
compatibility_date = "2024-01-29"
compatibility_flags = ["nodejs_compat"]

# Variables de entorno (desarrollo)
[vars]
ENVIRONMENT = "development"

# Database D1 binding
[[d1_databases]]
binding = "TURNO_PVU_DB"
database_name = "turno-pvu-db"
database_id = "" # Llenar después de crear la DB

# KV namespace para caché y rate limiting
[[kv_namespaces]]
binding = "TURNO_PVU_CACHE"
id = "" # Crear con: npx wrangler kv:namespace create TURNO_PVU_CACHE

# Observability
[observability]
enabled = true

[limits]
cpu_ms = 50
